name: build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch or sha to build
        default: mercusys-mr80x-v2-wired
      config:
        description: Config file under configs/
        default: mr80x-v2-wired.diffconfig
      release:
        description: Publish a GitHub release with the images
        type: boolean
        default: true
      imagebuilder:
        description: Build the ImageBuilder tarball
        type: boolean
        default: true
      all_kmods:
        description: Build every kernel module package
        type: boolean
        default: true
      sdk:
        description: Build the SDK tarball
        type: boolean
        default: false
  push:
    branches: [compiler]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/openwrt-compiler

jobs:
  plan:
    # A push only registers the workflow with the Actions API and stops here.
    # Every other job needs plan, so they skip with it.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.p.outputs.sha }}
      short: ${{ steps.p.outputs.short }}
      tag: ${{ steps.p.outputs.tag }}
      image: ${{ steps.p.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - id: p
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          # The branch name goes in the tag so a release states which
          # source branch it was built from. A sha input names no branch,
          # so look one up that contains it before falling back to the
          # raw input. Only the characters a git tag and a docker tag
          # both accept survive.
          name="$SOURCE_REF"
          if printf '%s' "$name" | grep -Eq '^[0-9a-f]{7,40}$'; then
            name=$(git branch -r --contains "$sha" --format '%(refname:lstrip=3)' \
                   | grep -v '^HEAD$' | head -n1)
            name="${name:-$SOURCE_REF}"
          fi
          slug=$(printf '%s' "$name" | tr -c 'A-Za-z0-9._-' '-' | sed 's/^[.-]*//;s/[.-]*$//')
          tag="v$(date -u +%Y.%m.%d).${{ github.run_number }}"
          if [ -n "$slug" ]; then
            tag="$tag.$slug"
          fi
          {
            echo "sha=$sha"
            echo "short=${sha:0:12}"
            echo "tag=$tag"
            echo "image=$IMAGE:$tag"
          } >> "$GITHUB_OUTPUT"

  image:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: .packaging

      # The default docker driver cannot export a gha cache.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # secrets is not available in a job-level if, so the tag list is
      # built here and Docker Hub drops out when the secrets are unset.
      - name: Tag list
        id: tags
        env:
          USER: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          hub=false
          if [ -n "${USER:-}" ] && [ -n "${TOKEN:-}" ]; then
            hub=true
          else
            echo "DOCKERHUB_USERNAME or DOCKERHUB_TOKEN unset, ghcr.io only"
          fi
          echo "hub=$hub" >> "$GITHUB_OUTPUT"
          {
            echo 'list<<EOF'
            echo "${{ needs.plan.outputs.image }}"
            echo "$IMAGE:latest"
            if [ "$hub" = true ]; then
              echo "docker.io/$USER/openwrt-compiler:${{ needs.plan.outputs.tag }}"
              echo "docker.io/$USER/openwrt-compiler:latest"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        if: steps.tags.outputs.hub == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .packaging
          file: .packaging/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  firmware:
    needs: [plan, image]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.plan.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Running out of disk fails deep in the toolchain and never says so.
      # The host's own free space cannot be reclaimed from a container job,
      # so this only records the starting margin.
      - name: Disk
        run: df -h /

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: actions/checkout@v4
        with:
          path: .packaging

      # The actions run as root because the runner owns /__w as root.
      # Buildroot refuses to run as root, so make runs as build.
      - name: Hand the tree to the build user
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          chown -R build:build "$PWD"

      # The github mirrors clone far faster from a runner than
      # git.openwrt.org does.
      - name: Feeds
        run: |
          su build -s /bin/bash -c 'set -euo pipefail
          git config --global --add safe.directory "*"
          cp .packaging/configs/feeds.conf feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a'

      # Fixes that live neither on the source branch nor upstream: build
      # breakage in a feed, a kernel change no package has caught up with.
      # Applied at the tree root after the feeds exist, so a patch can also
      # add a file under feeds/. Each one is dry-run first and skipped
      # whole if it does not apply, so a patch that upstream has since
      # merged costs a log line and nothing else.
      # A container job runs this under the image's sh, which is dash, so
      # no arrays and no shopt.
      - name: Custom patches
        run: |
          set -u
          found=0
          for p in .packaging/patches/*.patch; do
            [ -e "$p" ] || continue
            if [ "$found" = 0 ]; then
              found=1
              echo "| patch | result |" >> "$GITHUB_STEP_SUMMARY"
              echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
            fi
            name=$(basename "$p")
            if su build -s /bin/bash -c "patch -p1 -N --dry-run -i $PWD/$p" >/dev/null 2>&1; then
              su build -s /bin/bash -c "patch -p1 -N -i $PWD/$p"
              echo "applied $name"
              echo "| \`$name\` | applied |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "skipped $name, does not apply"
              echo "| \`$name\` | skipped |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          [ "$found" = 1 ] || echo "no custom patches"

      # The config file names the device and its packages. What the dispatch
      # adds here is what to emit besides the image, so a user can compose
      # their own image without this toolchain.
      - name: Config
        env:
          WANT_IB: ${{ inputs.imagebuilder }}
          WANT_SDK: ${{ inputs.sdk }}
          WANT_ALL_KMODS: ${{ inputs.all_kmods }}
        run: |
          set -euo pipefail
          cp ".packaging/configs/${{ inputs.config }}" .config
          {
            # Delete each build directory once it has compiled. The runner
            # has little disk margin and nothing here rebuilds incrementally.
            echo 'CONFIG_AUTOREMOVE=y'
            if [ "$WANT_IB" = true ]; then
              echo 'CONFIG_IB=y'
              # Embed the packages instead of fetching them from
              # downloads.openwrt.org, whose kmods are built against a
              # different kernel and will not resolve against ours.
              echo 'CONFIG_IB_STANDALONE=y'
            fi
            if [ "$WANT_SDK" = true ]; then
              echo 'CONFIG_SDK=y'
            fi
            if [ "$WANT_ALL_KMODS" = true ]; then
              echo 'CONFIG_ALL_KMODS=y'
            fi
          } >> .config
          chown build:build .config
          su build -s /bin/bash -c 'set -euo pipefail
          make defconfig
          ./scripts/diffconfig.sh > config.effective
          diff -u ".packaging/configs/${{ inputs.config }}" config.effective || true'

      # A device symbol that does not exist is dropped by defconfig without
      # an error, and the build silently falls back to the first device of
      # the target. Fail here instead of releasing the wrong image.
      - name: Check the requested profile survived defconfig
        run: |
          set -euo pipefail
          want=$(sed -n 's/^CONFIG_TARGET_PROFILE="\(.*\)"$/\1/p' \
                 ".packaging/configs/${{ inputs.config }}")
          if [ -z "$want" ]; then
            echo "config sets no CONFIG_TARGET_PROFILE" >&2
            exit 1
          fi
          got=$(sed -n 's/^CONFIG_TARGET_PROFILE="\(.*\)"$/\1/p' .config)
          if [ "$want" != "$got" ]; then
            echo "requested profile $want, .config has ${got:-none}" >&2
            exit 1
          fi
          echo "profile $got"

      # A dependency the tree does not satisfy leaves the symbol out of
      # .config and the tarball is simply never built, with nothing in the
      # log to say so.
      - name: Check the requested outputs survived defconfig
        env:
          WANT_IB: ${{ inputs.imagebuilder }}
          WANT_SDK: ${{ inputs.sdk }}
          WANT_ALL_KMODS: ${{ inputs.all_kmods }}
        run: |
          set -euo pipefail
          fail=0
          check() {
            if [ "$2" != true ]; then
              return 0
            fi
            if grep -qx "CONFIG_$1=y" .config; then
              echo "CONFIG_$1=y"
            else
              echo "requested CONFIG_$1, defconfig dropped it" >&2
              fail=1
            fi
          }
          check IB "$WANT_IB"
          check IB_STANDALONE "$WANT_IB"
          check SDK "$WANT_SDK"
          check ALL_KMODS "$WANT_ALL_KMODS"
          exit $fail

      - uses: actions/cache@v4
        with:
          path: dl
          key: dl-${{ inputs.config }}-${{ needs.plan.outputs.short }}
          restore-keys: dl-${{ inputs.config }}-

      - name: Own the restored download cache
        run: chown -R build:build dl 2>/dev/null || true

      - name: Download sources
        run: su build -s /bin/bash -c 'make -j"$(nproc)" download'

      - name: Build
        run: su build -s /bin/bash -c 'make -j"$(nproc)" || make -j1 V=s'

      # Signed with the key this build generated, which is also the key the
      # image carries in /etc/apk/keys, so the tree serves as a feed for the
      # image it shipped with.
      - name: Package index
        run: su build -s /bin/bash -c 'make package/index'

      - name: Collect images
        run: |
          set -euo pipefail
          mkdir -p out
          find bin/targets -type f \
            \( -name '*sysupgrade*' -o -name '*factory*' -o -name 'sha256sums' \
               -o -name '*.manifest' \) -exec cp -t out {} +
          ls -l out

      - name: Collect ImageBuilder and SDK
        run: |
          set -euo pipefail
          find bin/targets -type f \
            \( -name 'openwrt-imagebuilder-*.tar.*' \
               -o -name 'openwrt-sdk-*.tar.*' \) -exec cp -t out {} +
          ls -l out

      # One asset rather than several hundred loose .apk files. Unpacked
      # under a web root it is an apk feed; the layout is what apk expects.
      - name: Collect packages
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          # -prune so a feed directory nested under bin/packages is not
          # archived a second time on its own.
          dirs=$(cd bin && find . -type d -name packages -prune | sed 's|^\./||')
          if [ -z "$dirs" ]; then
            echo "no package directories under bin" >&2
            exit 1
          fi
          tar -C bin -caf "out/openwrt-packages-$TAG.tar.zst" $dirs
          ls -l out

      - name: Disk after build
        if: always()
        run: df -h /

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ needs.plan.outputs.short }}
          path: out/
          if-no-files-found: error

  release:
    needs: [plan, firmware]
    if: inputs.release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware-${{ needs.plan.outputs.short }}
          path: out

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ needs.plan.outputs.sha }}
          name: ${{ needs.plan.outputs.tag }}
          body: |
            Source: `${{ inputs.source_ref }}` at `${{ needs.plan.outputs.sha }}`
            Config: `${{ inputs.config }}`
            Image: `${{ needs.plan.outputs.image }}`

            Add packages without this toolchain, on x86_64 Linux:

            ```
            tar xf openwrt-imagebuilder-*.tar.zst && cd openwrt-imagebuilder-*
            make image PROFILE=mercusys_mr80x-v2 PACKAGES="sqm-scripts luci-app-sqm tc-full kmod-sched-cake"
            ```

            `make info` lists the profiles and the default package set.
            Testing builds, not upstream OpenWrt.
          files: out/*
